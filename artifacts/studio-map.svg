<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Nonarkara studio map  from city reporter to civic studio</title>
  <desc id="desc">Cluster map of the public GitHub surface as of 31 August 2026, with private origin and private twins named at purpose level only.</desc>
  <defs>
    <style>
      .bg { fill: #f4efe6; }
      .rule { stroke: #1c1916; stroke-width: 1; fill: none; }
      .ink { fill: #1c1916; }
      .muted { fill: #5c564c; }
      .paper { fill: #fffdf8; }
      .laterite { fill: #c45c26; }
      .teal { fill: #2a7a74; }
      .gold { fill: #c4a35a; }
      .archive { fill: #e8e2d6; }
      .private { fill: #1c1916; }
      .private-text { fill: #f4efe6; }
      .label { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Times New Roman", serif; }
      .sans { font-family: "Source Sans 3", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="720"/>
  <rect x="36" y="36" width="1028" height="648" class="paper" stroke="#1c1916" stroke-width="1.25"/>

