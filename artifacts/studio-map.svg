  <rect class="paper" x="740" y="504" width="300" height="140" rx="2" stroke="#1c1916" stroke-width="1"/>
  <text class="sans teal" x="756" y="532" font-size="11" letter-spacing="1.4">ONE MAC</text>
  <text class="label ink" x="756" y="560" font-size="16">Axiom · Each · council</text>
  <text class="sans ink" x="756" y="584" font-size="12">axiom.nonarkara.org · each.nonarkara.org</text>
