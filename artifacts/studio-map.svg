  <rect class="private" x="60" y="140" width="240" height="156" rx="2"/>
  <text class="sans private-text" x="76" y="168" font-size="11" letter-spacing="1.4">ORIGIN · PRIVATE</text>
  <text class="label private-text" x="76" y="196" font-size="16">city-reporter-bot</text>
  <text class="sans private-text" x="76" y="218" font-size="12">Account created 2024-10-18</text>
  <text class="sans private-text" x="76" y="238" font-size="12">to host a city reporter.</text>
  <text class="sans" x="76" y="264" font-size="11" fill="#c4a35a">+ v2 · + LINE bot · not cloned</text>

